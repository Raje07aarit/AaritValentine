<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>For My Cherry 🍒</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff758c;
            --cherry-red: #d31d4e;
            --chiku-color: #b07d62;
            --chiku-shadow: #8a5a44;
            --leaf-green: #7bed9f;
        }

        /* iOS & SCROLL FIXES */
        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            overflow: hidden; position: fixed;
        }

        body {
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BACKGROUND --- */
        #bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .bg-icon {
            position: absolute; font-size: 1.5rem;
            animation: floatUp linear infinite; opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- THE CUTE CHIKU --- */
        .chiku-wrapper {
            position: relative;
            width: 150px; height: 160px;
            margin: 0 auto 15px auto;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Body Shape */
        .chiku-body {
            width: 140px; height: 130px;
            background-color: var(--chiku-color);
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            position: absolute; bottom: 0; left: 5px;
            box-shadow: inset -8px -8px 0 rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.1);
            z-index: 5;
        }

        /* Texture (Freckles) */
        .chiku-body::before {
            content: ''; position: absolute; top: 35%; left: 15%;
            width: 3px; height: 3px; background: rgba(80, 40, 20, 0.15);
            border-radius: 50%;
            box-shadow: 
                60px 5px 0 rgba(80, 40, 20, 0.15), 
                20px 40px 0 rgba(80, 40, 20, 0.15),
                90px 35px 0 rgba(80, 40, 20, 0.15),
                100px 10px 0 rgba(80, 40, 20, 0.15);
        }

        /* Leaf */
        .leaf {
            position: absolute; top: 10px; left: 50%;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid var(--leaf-green);
            border-radius: 50%;
            transform: translateX(-50%) rotate(-10deg);
            transform-origin: bottom center;
            z-index: 4;
        }

        /* --- EYES (Super Cute) --- */
        .face {
            position: absolute; top: 48%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 50px;
            z-index: 6;
        }

        .eyes-container {
            display: flex; justify-content: space-between; width: 100%;
        }

        .eye {
            width: 34px; height: 34px;
            background: #2d2d2d;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        /* Eye Highlights */
        .eye::after {
            content: ''; position: absolute; top: 6px; right: 8px;
            width: 12px; height: 12px; background: white; border-radius: 50%;
        }
        .eye::before {
            content: ''; position: absolute; bottom: 8px; left: 8px;
            width: 5px; height: 5px; background: rgba(255,255,255,0.7); border-radius: 50%;
            z-index: 2;
        }

        /* Cheeks */
        .cheeks {
            position: absolute; top: 32px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 2px;
        }
        .cheek {
            width: 18px; height: 10px; background: #ffa5c0;
            border-radius: 50%; opacity: 0.7; filter: blur(2px);
        }

        /* Mouth */
        .mouth {
            position: absolute; top: 32px; left: 50%;
            transform: translateX(-50%);
            width: 12px; height: 6px;
            border-bottom: 2px solid #4a3b32;
            border-radius: 0 0 10px 10px;
        }

        /* Hands */
        .hands {
            position: absolute; bottom: 35px; width: 100%;
            display: flex; justify-content: center; gap: 30px; z-index: 7;
        }
        .hand {
            width: 24px; height: 24px; background: var(--chiku-color);
            border-radius: 50%;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.1);
        }

        /* --- FLOWER (SVG) --- */
        .flower-container {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); z-index: 8;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            animation: offerFlower 2s ease-in-out infinite alternate;
        }
        
        @keyframes offerFlower {
            from { transform: translateX(-50%) rotate(-3deg); }
            to { transform: translateX(-50%) rotate(3deg) translateY(-2px); }
        }

        /* --- SAD STATE --- */
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .sad .mouth {
            border-bottom: none; border-top: 2px solid #4a3b32;
            border-radius: 10px 10px 0 0; top: 35px;
        }
        .sad .eye { height: 20px; border-radius: 20px 20px 0 0; transform-origin: bottom; background: #444; }
        .sad .eye::after, .sad .eye::before { display: none; }
        .sad .flower-container { 
            transform: translateX(-50%) rotate(45deg) translateY(20px); 
            opacity: 0.6; animation: none; 
        }
        .tear {
            display: none; position: absolute; top: 35px; left: 5px;
            width: 8px; height: 12px; background: #54a0ff; border-radius: 50%;
            z-index: 20;
        }
        .sad .tear { display: block; animation: cry 1.5s infinite; }
        
        @keyframes cry {
            0% { transform: translateY(0); opacity: 0.8; }
            100% { transform: translateY(25px); opacity: 0; }
        }

        /* --- CARD & UI --- */
        .card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(5px);
            padding: 1.5rem; border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2);
            text-align: center; z-index: 20; width: 88%; max-width: 350px;
            border: 4px solid #fff;
            position: relative;
        }

        h1 {
            font-family: 'Pacifico', cursive; color: var(--cherry-red);
            font-size: 1.8rem; margin: 0 0 10px 0;
            text-shadow: 1px 1px 0px #ffd1dc;
        }

        .question {
            font-size: 1.2rem; color: #555; font-weight: 700; margin-bottom: 20px;
            font-family: 'Nunito', sans-serif;
        }

        .btn-group {
            display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;
        }

        button {
            border: none; outline: none; cursor: pointer;
            border-radius: 50px; font-family: 'Fredoka One', cursive;
            transition: all 0.2s ease;
            -webkit-appearance: none; touch-action: manipulation;
        }

        #yesBtn {
            padding: 16px 0; width: 100%; font-size: 1.3rem;
            background-color: #2ecc71; color: white; box-shadow: 0 5px 0 #27ae60;
            z-index: 30;
        }

        #noBtn {
            padding: 12px 10px; font-size: 0.9rem;
            background-color: #ff4757; color: white; box-shadow: 0 4px 0 #e84118;
            max-width: 100%; white-space: normal; z-index: 30;
        }

        .hidden { display: none !important; }
        
        .confetti {
            position: absolute; z-index: 99; pointer-events: none;
            animation: fall 3s linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div class="card" id="questionCard">
        <h1>Hey Cherry 🍒</h1>
        
        <!-- THE NEW CUTE CHIKU -->
        <div class="chiku-wrapper" id="chiku">
            <div class="leaf"></div>
            <div class="chiku-body">
                <div class="face">
                    <div class="eyes-container">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="cheeks">
                        <div class="cheek"></div>
                        <div class="cheek"></div>
                    </div>
                    <div class="mouth"></div>
                    <div class="tear" id="tearDrop"></div>
                </div>
                
                <div class="hands">
                    <div class="hand"></div>
                    <div class="hand"></div>
                </div>

                <!-- Rose SVG -->
                <div class="flower-container">
                    <svg width="45" height="60" viewBox="0 0 50 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M25 70C25 70 28 50 25 35" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
                        <path d="M25 50C25 50 35 45 40 50C40 50 35 55 25 52" fill="#66BB6A"/>
                        <circle cx="25" cy="25" r="15" fill="#E91E63"/>
                        <circle cx="20" cy="20" r="10" fill="#F06292"/>
                        <circle cx="30" cy="20" r="10" fill="#F06292"/>
                        <circle cx="25" cy="32" r="10" fill="#F06292"/>
                        <path d="M25 20C25 20 20 25 25 30C25 30 30 25 25 20Z" fill="#F8BBD0"/>
                    </svg>
                </div>
            </div>
        </div>

        <p class="question">Will you be my Valentine?</p>

        <div class="btn-group">
            <button id="yesBtn">YES! 💖</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- SUCCESS CARD -->
    <div class="card hidden" id="successCard">
        <h1>YAYYY! 🥳</h1>
        
        <div class="chiku-wrapper">
            <div class="leaf"></div>
            <div class="chiku-body">
                <div class="face" style="top: 45%;">
                    <div class="eyes-container" style="justify-content: center; font-size: 40px; margin-top: -10px;">
                        <div>😍</div>
                    </div>
                    <div class="cheeks">
                        <div class="cheek"></div><div class="cheek"></div>
                    </div>
                </div>
                <div class="hands" style="bottom: 80px; gap: 90px;">
                    <div class="hand"></div><div class="hand"></div>
                </div>
            </div>
        </div>

        <p class="question" style="color: #d31d4e; font-size: 1.1rem;">
            Love you meri jaan! ❤️<br>
            <span style="font-size: 0.9rem; color: #777;">Vese velentine ka mtlb girlfriend hi hota 😉</span>
        </p>
    </div>

    <script>
        const questionCard = document.getElementById('questionCard');
        const successCard = document.getElementById('successCard');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const chiku = document.getElementById('chiku');
        const bgContainer = document.getElementById('bg-container');
        const tearDrop = document.getElementById('tearDrop');

        // Large list of cute/emotional responses (No Anger)
        const noTexts = [
            "Ms. Bikaner please? 🥺", 
            "Meri jaaaaaan ❤️", 
            "Ms. Baby maan jao 🍬", 
            "Cutie pie don't do this 😣", 
            "Sweetie pie please 🥧", 
            "Cherry pie I love you 🍒", 
            "Chiku is waiting... 🥔", 
            "Kiddo, really? 😟", 
            "Little lady... 🌹", 
            "Devi ji kripa karo 🙏", 
            "Madam ji smile kro 😊", 
            "Ms. Take care plox 💕", 
            "Babyyyyyyy 😭", 
            "Sweet princess 👑", 
            "Pyari pari... ✨",
            "Icecream khilaunga 🍦", 
            "Jldi milne aaunga 🏍️", 
            "Dekh lo ro doonga 😭", 
            "Sachi ro dunga 😢", 
            "Yaar aap mjaak maan rhe 🥺", 
            "Dil toot jayega 💔",
            "Think again Sweetie pie! 💕",
            "Ms. Bikaner, ek baar haan bolo 🥺",
            "Baby, Chiku is sad 😢",
            "Don't say no to Cherry 🍒",
            "Meri pyari Devi ji 🙏",
            "Cutie pie, pretty please? 🌸",
            "Sirf aap hi to ho ❤️",
            "Chiku loves you 🥔",
            "Maan jao na Babu 🥺",
            "Last chance meri jaan 🌹",
            "Sweetie pie, I promise hugs 🤗",
            "Kiddo, don't break my heart 💔",
            "Pyari pari, say yes! ✨"
        ];

        let clickCount = 0;
        let yesScale = 1;
        let tearSpeed = 1.5;

        // 1. Background Animation
        function createBackground() {
            const icons = ['🍒', '💗', '🌸', '🤍', '🥔', '🫂', '😘'];
            for (let i = 0; i < 35; i++) {
                const span = document.createElement('span');
                span.classList.add('bg-icon');
                span.innerText = icons[Math.floor(Math.random() * icons.length)];
                span.style.left = Math.random() * 90 + 'vw';
                span.style.animationDuration = (Math.random() * 5 + 6) + 's';
                span.style.animationDelay = Math.random() * 5 + 's';
                span.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                bgContainer.appendChild(span);
            }
        }
        createBackground();

        // 2. No Button Logic
        noBtn.addEventListener('click', function() {
            clickCount++;
            
            if (clickCount >= 100) {
                // The End Game
                noBtn.innerText = "That's the 100th no! 🛑";
                setTimeout(() => {
                    noBtn.style.display = 'none';
                    yesBtn.style.transform = "scale(1.4)";
                    yesBtn.innerText = "Click YES now! 💖";
                }, 1000);
            } else {
                // Cycle through the texts
                const textIndex = (clickCount - 1) % noTexts.length;
                noBtn.innerText = noTexts[textIndex];
                
                // Make Chiku Sad
                chiku.classList.add('sad');
                
                // Make Chiku cry faster as she clicks more
                if(tearSpeed > 0.2) {
                    tearSpeed -= 0.05; // Make tear fall faster
                    tearDrop.style.animationDuration = `${tearSpeed}s`;
                }

                // VERY SLOW GROWTH for Yes button
                // 100 clicks * 0.005 = 0.5 growth (Starts at 1, ends at 1.5)
                if (yesScale < 1.6) { 
                    yesScale += 0.005; 
                    yesBtn.style.transform = `scale(${yesScale})`;
                }
            }
        });

        // 3. Yes Button Logic
        yesBtn.addEventListener('click', function() {
            questionCard.classList.add('hidden');
            successCard.classList.remove('hidden');
            startConfetti();
        });

        function startConfetti() {
            const colors = ['#ff758c', '#ff7eb3', '#2ecc71', '#fad0c4'];
            const emojis = ['🍒', '❤️', '😘', '🫂'];
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('confetti');
                if (Math.random() > 0.5) {
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.fontSize = Math.random() * 20 + 15 + 'px';
                } else {
                    el.style.width = '10px'; el.style.height = '10px';
                    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    el.style.borderRadius = '50%';
                }
                el.style.left = Math.random() * 100 + 'vw';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }, 100);
        }
    </script>
</body>
</html>
